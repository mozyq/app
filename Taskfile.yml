version: "3"

vars:
  GRID: 21 # tiles per row/col, must be odd; needs GRID*GRID tiles
  TRANSITIONS: 9
  FPT: 80 # frames per transition zoom -- higher = slower
  FPS: 30
  MIN_TILES: 1001 # 1000 emoji tiles + 1 master
  # seed image: emoji code point / "U+..." / emoji char, or an image path
  MASTER: 1F970

tasks:
  publish:
    cmds:
      - poetry version patch
      - poetry publish --build
      - git tag $(poetry version -s)
      - git commit -am "$(poetry version)"
      - git push

  # --- emoji mosaic demo -----------------------------------------------------
  # `task emoji` runs the whole pipeline; each step has a `status:` check so
  # re-running only redoes what is missing or stale.

  emoji:
    desc: Build the emoji mosaic demo video (emojis.mp4) end to end.
    # Each step is a dep of the next, so this walks the whole chain; every
    # step's `status:` check lets `task` skip it when its output is current.
    cmds:
      - task: emoji:video

  emoji:svg:
    internal: true
    cmds:
      - git clone --depth 1 --filter=blob:none --sparse https://github.com/googlefonts/noto-emoji.git demo/noto-emoji
      - git -C demo/noto-emoji sparse-checkout set svg
    status:
      - test -d demo/noto-emoji/svg

  emoji:tiles:
    desc: Rasterize + filter emoji SVGs into emojis/ (review these before building the video).
    deps: [emoji:svg]
    cmds:
      - EMOJI_MASTER='{{.MASTER}}' uv run python demo/make_emojis.py
    status:
      - test -f emojis/0000_master.jpg
      - test "$(find emojis -name '*.jpg' | wc -l)" -ge {{.MIN_TILES}}
      - test emojis/0000_master.jpg -nt demo/make_emojis.py
      - test emojis/0000_master.jpg -nt demo/emoji_blocklist.txt
      - test emojis/0000_master.jpg -nt Taskfile.yml # rebuild if MASTER changed

  emoji:json:
    desc: Solve the mosaic chain into emojis.mzq.json.
    deps: [emoji:tiles]
    cmds:
      - uv run mzq json emojis/0000_master.jpg emojis.mzq.json --grid-size {{.GRID}} --max-transitions {{.TRANSITIONS}}
    status:
      - test emojis.mzq.json -nt emojis/0000_master.jpg
      - test emojis.mzq.json -nt Taskfile.yml # rebuild if GRID / TRANSITIONS changed

  emoji:frames:
    desc: Render video frames from emojis.mzq.json.
    deps: [emoji:json]
    cmds:
      - rm -rf frames
      - uv run mzq frames emojis.mzq.json frames/ --fpt {{.FPT}}
    status:
      - test -d frames
      - test frames/0000.jpg -nt emojis.mzq.json
      - test frames/0000.jpg -nt Taskfile.yml # rebuild if FPT changed
      - test "$(find frames -name '*.jpg' | wc -l)" -ge {{.FPT}}

  emoji:video:
    desc: Encode frames/ into emojis.mp4.
    deps: [emoji:frames]
    # -crf 14 + veryslow: near-transparent quality (file size is a non-issue for a
    # short demo). yuv420p + faststart keep it playable everywhere / streamable.
    # bt709 tags stop players colour-shifting the source JPEGs.
    cmds:
      - >-
        ffmpeg -y -framerate {{.FPS}} -i frames/%04d.jpg
        -c:v libx264 -preset veryslow -crf 14 -pix_fmt yuv420p
        -color_primaries bt709 -color_trc bt709 -colorspace bt709
        -movflags +faststart emojis.mp4
    status:
      - test emojis.mp4 -nt frames/0000.jpg
      - test emojis.mp4 -nt Taskfile.yml # re-encode if FPS / encode settings changed

  emoji:clean:
    desc: Remove emoji demo artifacts (keeps the sparse-cloned SVGs).
    cmds:
      - rm -rf emojis frames emojis.mzq.json emojis.mp4
